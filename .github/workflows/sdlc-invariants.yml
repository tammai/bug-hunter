# Managed by the sdlc plugin v3.5.0 (seeded: replaced on upgrade only while unedited).
# Checks the record and the baseline of active features: see .sdlc/ci/invariants.py.
name: sdlc invariants

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "shared sdlc files"
        env:  # branch names reach the shell only as variables
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 .sdlc/ci/invariants.py --base "origin/$BASE_REF" --require-ancestor
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            python3 .sdlc/ci/invariants.py --base "$BEFORE"
          else
            python3 .sdlc/ci/invariants.py
          fi
