[project]
name = "bug-hunter"
version = "0.1.0"
description = "Claude Code plugin that hunts reproducible bugs in a repo and drafts an issue for each."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
extend = ".sdlc/lint/ruff.sdlc.toml"
extend-exclude = [".sdlc", "contracts"]  # plugin-owned and vendored files
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]  # scripts are CLIs; print() is their output
